    const gevoelen = Array.from(document.querySelectorAll('#gevoelGroup input[name=gevoel]:checked')).map(c => c.closest('label').querySelector('span').textContent);
    const gevoelAndere = document.getElementById('gevoelAndereInput').value.trim();
    if (document.getElementById('gevoelAndereToggle').checked && gevoelAndere) gevoelen.push(gevoelAndere);
    const dieperChecked = (document.querySelector('input[name=dieper]:checked') || {}).value;
    const diepgangChecked = document.querySelector('input[name=diepgang]:checked');
    const herkenning = (document.querySelector('input[name=herkenning]:checked') || {}).value;

    const lines = [];
    if (perspectief === 'derde') {
      lines.push(`Question: Is this directly between you and someone else, or are you on the sidelines?\nAnswer: I am on the sidelines, this is between others${tussenWie ? ': ' + tussenWie : ''}.`);
    }
    const schoolAge = document.getElementById('qSchoolAge') ? document.getElementById('qSchoolAge').value.trim() : '';
    if (categorySelect.value === 'school' && schoolAge) {
      lines.push(`Question: Age or school grade of the child involved\nAnswer: ${schoolAge}`);
    }
    lines.push(`Question: What exactly happened?\nAnswer: ${document.getElementById('qWat').value.trim()}`);
    if (gevoelen.length) lines.push(`Question: What did you feel at that moment?\nAnswer: ${gevoelen.join(', ')}`);
    const gevoelTekst = document.getElementById('qGevoelTekst').value.trim();
    if (gevoelTekst) lines.push(`Question: Addition to the feeling\nAnswer: ${gevoelTekst}`);
    lines.push(`Question: ${document.getElementById('qNodigLabel').textContent}\nAnswer: ${document.getElementById('qNodig').value.trim()}`);
    if (herkenning) {
      const herkenningTekst = document.getElementById('qHerkenningTekst').value.trim();
      lines.push(`Question: Do you recognize this from before?\nAnswer: ${({ ja: 'yes', nee: 'no', 'weet niet': 'I do not know' })[herkenning] || herkenning}${herkenningTekst ? ', ' + herkenningTekst : ''}`);
    }
    if (dieperChecked) {
      const dieperTekst = document.getElementById('qDieperTekst').value.trim();
      let answer = ({ ja: 'yes', nee: 'no', 'weet niet': 'I do not know' })[dieperChecked] || dieperChecked;
      if (dieperTekst) answer += `. Explanation: ${dieperTekst}`;
      lines.push(`Question: Was this purely about this, or is there more beneath it?\nAnswer: ${answer}`);
    }
    if (diepgangChecked) {
      const val = parseInt(diepgangChecked.value, 10);
      const answer = val <= 2 ? 'Closer to: superficial' : val >= 4 ? 'Closer to: very deep' : 'Somewhere in the middle';
      lines.push(`Question: How deeply does this affect you?\nAnswer: ${answer}`);
    }
    const extra = document.getElementById('qExtra').value.trim();
    if (extra) lines.push(`Question: Anything else to add?\nAnswer: ${extra}`);

    const content = lines.join('\n\n');

    app.innerHTML = `<div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line" style="height:32px;width:70%;margin-bottom:20px"></div><div class="skeleton skeleton-block"></div>`;

    try {
      const res = await fetch('/.netlify/functions/create-reflection', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, name, category, content, perspective: perspectief, thirdPartyContext: tussenWie, lang: PAGE_LANG }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      window.history.replaceState({}, '', `/en/reflectie.html?token=${data.token}`);
      pollResult(data.token);
    } catch (err) {
      renderForm();
      document.getElementById('error').textContent = err.message;
      document.getElementById('error').style.display = 'block';
    }
  });
}

    try { pendingLang = localStorage.getItem('mp_pending_selfhelp_lang'); } catch (e) {}
    if (pendingLang && pendingLang !== PAGE_LANG) {
      window.location.replace((pendingLang === 'en' ? '/en' : '') + '/reflectie.html' + window.location.search);
      return;
    }
    let pendingToken = null;
    try { pendingToken = localStorage.getItem('mp_pending_selfhelp'); } catch (e) {}
    if (pendingToken) {
      try { localStorage.removeItem('mp_pending_selfhelp'); } catch (e) {}
      window.history.replaceState({}, '', `/en/reflectie.html?token=${pendingToken}`);
      renderSelfHelpForm(pendingToken);
    } else {
      app.innerHTML = `<div class="error-box">We could not find your reflection automatically. Use the link from your confirmation email, or contact us at middlepoint@zohomail.eu.</div>`;
    }
  } else if (existingToken) {
    // Viewing an existing reflection via a link does NOT require logging in,
    // so shared links (e.g. via WhatsApp) keep working for everyone.
    pollResult(existingToken);
  } else {
// Only STARTING a new reflection requires logging in.
    await checkAuth();
    if (currentUser) {
      renderForm();
    } else {
      try { localStorage.setItem('mp_return_to', '/en/reflectie.html'); } catch (e) {}
      renderAuthGate();
    }
  }
})();
</script>
