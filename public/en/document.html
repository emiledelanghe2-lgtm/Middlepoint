<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Your document, Middlepoint</title>
<link rel="alternate" hreflang="nl" href="https://middlepoint.net/document.html">
<link rel="alternate" hreflang="en" href="https://middlepoint.net/en/document.html">
<link rel="alternate" hreflang="x-default" href="https://middlepoint.net/document.html">
<link rel="stylesheet" href="/style.css">
<script src="/lang.js"></script>
<style>
@media print {
  .nav-bar, .no-print { display: none !important; }
  body { background: white; }
  .app-wrap { max-width: 100%; padding: 20px; }
  .doc-section { break-inside: avoid; }
}
.doc-quote{ border-left:3px solid var(--clay); padding-left:18px; margin:32px 0; font-family:'Fraunces',serif; font-style:italic; font-size:1.05rem; color:var(--ink); }
.warning-banner{ background:var(--clay-soft); border:1px solid var(--clay); border-radius:var(--radius); padding:14px 18px; margin-bottom:20px; font-size:.88rem; }
.info-banner{ background:#EFF4ED; border:1px solid var(--sage); border-radius:var(--radius); padding:14px 18px; margin-bottom:20px; font-size:.88rem; }
</style>
</head>
<body>
<header class="nav-bar">
<nav class="nav">
  <a href="/en/" class="brand">middle<span>point</span></a>
</nav>
</header>

<div class="app-wrap" id="app" style="max-width:760px">
  <div class="status-box">Loading...</div>
</div>

<script>
const token = new URLSearchParams(window.location.search).get('token');
const backLink = '/';
const backLabel = 'Back to home page';
const app = document.getElementById('app');
const PAGE_LANG = 'en';

function goToMijnGesprekken() {
  window.location.href = '/en/mijn-gesprekken.html';
}

const QUOTES = {
  koppel: {
    main: 'A relationship does not grow by never clashing, but by continuing to choose each other after every clash.',
    followup: 'Progress is not about perfection, but about continuing to try together.',
  },
  familie: {
    main: 'You do not choose your family, but you can choose understanding.',
    followup: 'Breaking old patterns starts with one small, new conversation.',
  },
  vrienden: {
    main: 'A good friendship does not survive silence, but it does survive honesty.',
    followup: 'What you have repaired together is often stronger than what was never broken.',
  },
  buren: {
    main: 'Good neighbors do not fight, they make agreements.',
    followup: 'A small gesture of understanding often weighs more than being proven right.',
  },
  werk: {
    main: 'Working together starts with wanting to understand each other, not with wanting to be right.',
    followup: 'Change in the workplace grows step by step, not in a single conversation.',
  },
  school: {
    main: 'Those who listen well learn the most.',
    followup: 'Every small step forward counts, even if the problem is not completely solved yet.',
  },
  andere: {
    main: 'Understanding is the beginning of every solution.',
    followup: 'Progress, however small, is worth celebrating.',
  },
};

function getQuote(category, isFollowup) {
  const set = QUOTES[category] || QUOTES.andere;
  return isFollowup ? set.followup : set.main;
}

async function load() {
  const res = await fetch(`/.netlify/functions/get-document?token=${token}`);
  const data = await res.json();
  if (!res.ok) { app.innerHTML = `<div class="error-box">${data.error}</div>`; return; }
  if (data.lang && data.lang !== PAGE_LANG) {
    window.location.replace((data.lang === 'en' ? '/en' : '') + '/document.html' + window.location.search);
    return;
  }

  if (!data.documents.length) {
    app.innerHTML = `<div class="status-box">The document is still being prepared. This page reloads by itself.</div>`;
    setTimeout(load, 8000);
    return;
  }

  renderDoc(data);
}

function downloadPDF() { window.print(); }

function shareViaWhatsApp() {
  const link = window.location.href;
  const text = `Hi, our document from Middlepoint is ready. It is an honest, neutral overview of our conversation, with tips and agreements to move forward together.\n\nYou can find it here: ${link}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function shareMiddlepointReferral() {
  const text = `I used Middlepoint to get clarity together with someone on a difficult conversation. Maybe useful for you too: https://middlepoint.net/en/`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function shareViaEmail() {
  const link = window.location.href;
  const subject = encodeURIComponent('Your Middlepoint document is ready');
  const body = encodeURIComponent(`Hi,\n\nOur document from Middlepoint is ready. It is an honest, neutral overview of our conversation, with tips and agreements to move forward together.\n\nYou can find it here: ${link}`);
  window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

function docTitleFor(version) {
  return version === 1 ? 'Original document' : 'Follow-up document';
}

function renderDoc(data, displayVersion) {
  const allVersions = data.documents;
  const doc = displayVersion ? allVersions.find(d => d.version === displayVersion) : allVersions[0];
  const isPaid = data.isPaid || false;
  const showAdvisorInsight = data.showAdvisorInsight && doc.advisor_insight;
  const myName = data.myName;
  const isThirdPartyViewer = !!data.isThirdPartyViewer;
  const category = data.category || 'andere';
  const isFollowupDoc = doc.version >= 2;
  const followupAlreadyUsed = allVersions.some(d => d.version >= 2);
  const missingEmailNames = data.missingEmailNames || [];
  const keyPoints = doc.key_points || [];

  const perspectiveEntries = Object.entries(doc.perspectives || {});
  const questionEntries = Object.entries(doc.questions_to_ask || {});
  const myTipEntries = isThirdPartyViewer ? Object.entries(doc.tips || {}) : Object.entries(doc.tips || {}).filter(([name]) => name === myName);
  const myPhraseEntries = isThirdPartyViewer ? Object.entries(doc.suggested_phrases || {}) : Object.entries(doc.suggested_phrases || {}).filter(([name]) => name === myName);
  const sharedActions = doc.shared_actions || [];

  const versionPicker = allVersions.length > 1 ? `
    <div class="field" style="max-width:320px">
      <label>View</label>
      <select id="versionSelect">
        ${allVersions.map(d => `<option value="${d.version}" ${d.version === doc.version ? 'selected' : ''}>${docTitleFor(d.version)}</option>`).join('')}
      </select>
    </div>` : '';

  const missingEmailBanner = (!isThirdPartyViewer && missingEmailNames.length) ? `
    <div class="warning-banner no-print">
      <strong>Please note:</strong> we do not have an email address for ${missingEmailNames.join(' and ')}. Give this person the link to this conversation yourself, otherwise they cannot be notified automatically.
    </div>` : '';

  const readyReminderBanner = `
    <div class="info-banner no-print">
      You can always find this document again via <a href="/en/login.html" style="font-weight:600">My conversations</a>, also later on.
    </div>`;

  const keyPointsHTML = keyPoints.length ? `
    <div class="card" style="background:var(--clay-soft);border:none;margin-bottom:24px;padding:20px">
      <span class="label" style="display:block;margin-bottom:10px">In brief</span>
      <ul style="margin:0;padding-left:20px;color:var(--ink);font-weight:500">
        ${keyPoints.map(k => `<li style="margin-bottom:4px">${k}</li>`).join('')}
      </ul>
    </div>` : '';

  const mainSectionsHTML = isFollowupDoc ? `
    <div class="doc-section" style="border-left:4px solid var(--navy);padding-left:16px">
      <span class="label">⊙ Looking back</span>
      <h3>Short summary</h3>
      <p>${doc.shared_summary}</p>
    </div>

    <div class="doc-section" style="border-left:4px solid var(--sage);padding-left:16px">
      <span class="label">⟳ Progress</span>
      <h3>What is going better</h3>
      <p>${doc.common_ground}</p>
    </div>` : `
    <div class="doc-section" style="border-left:4px solid var(--navy);padding-left:16px">
      <span class="label">⊙ Objective overview</span>
      <h3>What is going on</h3>
      <p>${doc.shared_summary}</p>
    </div>

    <div class="doc-section" style="border-left:4px solid var(--sage);padding-left:16px">
      <span class="label">♡ Common ground</span>
      <h3>Where you already agree</h3>
      <p>${doc.common_ground}</p>
    </div>`;

app.innerHTML = `
    <a href="${backLink}" class="btn ghost no-print" style="margin-bottom:16px;display:inline-block">← ${backLabel}</a>
    <span class="label">${docTitleFor(doc.version)}${isThirdPartyViewer ? ' (full overview)' : ''}</span>
    <h1>Your document</h1>
    ${isFollowupDoc ? `<p style="color:var(--ink-soft);margin-bottom:20px">This is your <strong>follow-up document</strong>: an updated version based on how things have gone since your first conversation.</p>` : ''}

    ${missingEmailBanner}

    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px">
      <button onclick="downloadPDF()" class="btn outline" style="padding:9px 16px;font-size:.85rem">⬇ Download as PDF</button>
      <button onclick="shareViaEmail()" class="btn outline" style="padding:9px 16px;font-size:.85rem">✉ Send by email</button>
      <button onclick="shareViaWhatsApp()" class="btn whatsapp" style="padding:9px 16px;font-size:.85rem">Send via WhatsApp</button>
    </div>

    ${versionPicker}

    ${keyPointsHTML}

    ${mainSectionsHTML}

    ${isPaid ? `
    ${!isFollowupDoc ? `
    <div class="doc-section" style="border-left:4px solid var(--clay);padding-left:16px">
      <span class="label">◐ Perspective</span>
      <h3>How the other person sees it</h3>
      ${perspectiveEntries.map(([name, p]) => `
        <div class="person-block">
          <div class="who">For ${name}: how the other person sees this</div>
          <p><strong>What is probably going on for the other person:</strong> ${p.explanation}</p>
          <p><strong>What the other person does well:</strong> ${p.strengths}</p>
          <p><strong>Where the other person could grow:</strong> ${p.growth_areas}</p>
        </div>`).join('')}
    </div>` : ''}

    ${sharedActions.length ? `
    <div class="doc-section" style="border-left:4px solid var(--clay);padding-left:16px">
      <span class="label">⊙ Getting to work together</span>
      <h3>${isFollowupDoc ? 'Renewed agreements' : 'Concrete agreements to try together'}</h3>
      <ul class="tip-list">${sharedActions.map(a => `<li>${a}</li>`).join('')}</ul>
    </div>` : ''}

    ${!isFollowupDoc ? `
    <div class="doc-section" style="border-left:4px solid var(--navy);padding-left:16px">
      <span class="label">✎ Opening the conversation</span>
      <h3>Questions to ask each other</h3>
      ${questionEntries.map(([name, qs]) => `
        <div class="person-block">
          <div class="who">${name} can ask</div>
          <ul class="tip-list">${qs.map(q => `<li>${q}</li>`).join('')}</ul>
        </div>`).join('')}
    </div>` : ''}

${showAdvisorInsight ? `
    <div class="doc-section no-print" style="background:var(--navy);color:#fff;border-radius:var(--radius);padding:24px">
      <span class="label" style="color:#fff;opacity:.8">◇ For the facilitator, only visible to you</span>
      <h3 style="color:#fff">Professional insight</h3>
      <p style="color:#fff;opacity:.92">${doc.advisor_insight}</p>
    </div>` : ''}

    <div class="doc-section" style="border-left:4px solid var(--sage);padding-left:16px">
      <span class="label">✎ ${isThirdPartyViewer ? 'Personal sections' : 'Only for you'}</span>
      <h3>${isThirdPartyViewer ? 'Personal tips and phrases from both participants' : (isFollowupDoc ? 'Renewed tips for yourself' : 'Your personal section')}</h3>
      <p style="color:var(--ink-soft);font-size:.85rem;margin-bottom:16px">${isThirdPartyViewer ? 'As the organizer you see this full overview. The participants themselves each only see their own section.' : 'This entire section is only visible to you, not to the other participant.'}</p>
      ${myTipEntries.map(([name, tips]) => `
      <div class="person-block">
        <div class="who">Tips${isThirdPartyViewer ? ` for ${name}` : ' for yourself'}</div>
        <ul class="tip-list">${tips.map(t => `<li>${t}</li>`).join('')}</ul>
      </div>`).join('')}
      ${myPhraseEntries.map(([name, phrases]) => `
      <div class="person-block">
        <div class="who">What ${isThirdPartyViewer ? name : 'you'} could say</div>
        <ul class="tip-list">${phrases.map(p => `<li>"${p}"</li>`).join('')}</ul>
      </div>`).join('')}
    </div>

    <div class="doc-quote no-print">"${getQuote(category, isFollowupDoc)}"</div>
    ` : `
    <div class="doc-section no-print" style="background:var(--clay-soft);border-radius:var(--radius);padding:28px;border-bottom:none">
      <span class="label">There is more</span>
      <h3>This is your first insight</h3>
      <p style="color:var(--ink-soft);max-width:480px;margin:0 0 12px">The full document also contains:</p>
      <ul style="color:var(--ink-soft);margin:0 0 18px;padding-left:20px">
        <li>How the other person really sees it, explained in your language</li>
        <li>Personal tips, only visible to you</li>
        <li>Concrete questions to open the conversation</li>
        <li>Concrete, shared agreements to try together</li>
        <li>Phrases you can use word for word, only visible to you</li>
        <li>One follow-up document to come back to later</li>
      </ul>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a href="/en/pricing.html" class="btn clay">See everything that is included</a>
        <a href="/en/voorbeeld-document.html" class="btn outline">View an example</a>
      </div>
    </div>`}

    ${readyReminderBanner}

    <div class="doc-section no-print" style="text-align:center;border-bottom:none">
      ${isPaid ? (followupAlreadyUsed ? `
      <span class="label">Growth document</span>
      <h3>This conversation is complete</h3>
      <p style="color:var(--ink-soft);max-width:480px;margin:0 auto 18px">You have already used the follow-up for this conversation. Every conversation includes one follow-up document. Want to discuss something else? Feel free to start a new conversation.</p>
      <a href="/en/new.html" class="btn clay">Start a new conversation</a>
      ` : `
      <span class="label">Growth document</span>
      <h3>Come back later</h3>
      <p style="color:var(--ink-soft);max-width:480px;margin:0 auto 18px">Respond to the tips and agreements from your document, let us know what is already going better, and add what is still going on. This conversation includes one follow-up document. You can do that at any moment that suits you via <a href="/en/login.html">My conversations</a>.</p>
      <button id="startRoundBtn" class="btn clay">Start a follow-up</button>
      <div id="roundMsg" style="margin-top:12px;font-size:.9rem"></div>
      `) : ''}
      <div class="card no-print" style="background:#EFF4ED;border:none;margin-top:24px;padding:18px;text-align:center">
        <p style="margin:0 0 12px;font-size:.9rem">Did you find this valuable? Do you know anyone else who could benefit from it?</p>
        <button type="button" class="btn whatsapp" style="padding:9px 16px;font-size:.85rem" onclick="shareMiddlepointReferral()">Share Middlepoint via WhatsApp</button>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <a href="/en/" class="btn outline">Back to home page</a>
        <button type="button" class="btn clay" onclick="goToMijnGesprekken()">Go to My conversations</button>
      </div>
    </div>
  `;

  if (allVersions.length > 1) {
    document.getElementById('versionSelect').addEventListener('change', (e) => {
      renderDoc(data, parseInt(e.target.value, 10));
    });
  }

  if (isPaid && !followupAlreadyUsed) {
    document.getElementById('startRoundBtn').addEventListener('click', async () => {
      const btn = document.getElementById('startRoundBtn');
      const msg = document.getElementById('roundMsg');
      btn.disabled = true;
      btn.textContent = 'One moment...';
      msg.style.color = '';
      msg.textContent = '';
      try {
        const res = await fetch('/.netlify/functions/start-new-round', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error);
window.location.href = `/en/story.html?token=${token}`;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Start a follow-up';
        msg.style.color = '#8A4222';
        msg.textContent = err.message;
      }
    });
  }
}

load();
</script>
</body>
</html>
