<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn gesprekken, Middlepoint</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="nav-bar">
<nav class="nav" aria-label="Hoofdnavigatie">
  <a href="/" class="brand">middle<span>point</span></a>
  <div class="nav-links" id="navLinks">
    <a href="/">Home</a>
    <a href="/why.html">Waarom Middlepoint</a>
    <a href="/pricing.html">Prijzen</a>
    <a href="/testimonials.html">Getuigenissen</a>
    <a href="/login.html" class="current" aria-current="page">Mijn gesprekken</a>
  </div>
  <div class="nav-actions">
<a href="/new.html" class="btn">Start een gesprek</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu openen" aria-expanded="false">☰</button>
  </div>
</nav>
</header>
<script>
  (function() {
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      const isOpen = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.textContent = isOpen ? '✕' : '☰';
    });
    links.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = '☰';
      });
    });
  })();
</script>

<div class="app-wrap" id="app">
  <div class="skeleton skeleton-line short"></div>
  <div class="skeleton skeleton-line" style="height:32px;width:60%;margin-bottom:20px"></div>
  <div class="skeleton skeleton-block"></div>
  <div class="skeleton skeleton-block"></div>
</div>

<script>
// TODO: zelfde twee waarden invullen als in login.html — Supabase-dashboard → Settings → API
const SUPABASE_URL = 'JOUW_SUPABASE_URL_HIER';
const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY_HIER';
function makeSupabaseClient(persistent) {
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: persistent ? window.localStorage : window.sessionStorage },
  });
}
const supabaseClient = makeSupabaseClient(localStorage.getItem('mp_remember_me') === 'true');
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { storage: persistent ? window.localStorage : window.sessionStorage },
  });
}
let supabaseClient = null;
try {
  supabaseClient = makeSupabaseClient(localStorage.getItem('mp_remember_me') === 'true');
} catch (e) {
  console.error('Supabase-configuratie ontbreekt of is ongeldig (SUPABASE_URL/SUPABASE_ANON_KEY nog niet ingevuld?):', e);
}
const app = document.getElementById('app');
const STRIPE_PORTAL = 'https://billing.stripe.com/p/login/28EcN55IM0rig6J1B9aVa00';
const SELF_HELP_STRIPE_LINK = 'https://buy.stripe.com/9B65kD2wA2zq4o11B9aVa0j';

let currentAccessToken = null;

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function goToSelfHelpPayment(reflectionToken, email) {
  try { localStorage.setItem('mp_pending_selfhelp', reflectionToken); } catch (e) {}
  const sep = SELF_HELP_STRIPE_LINK.includes('?') ? '&' : '?';
  window.location.href = email ? `${SELF_HELP_STRIPE_LINK}${sep}prefilled_email=${encodeURIComponent(email)}` : SELF_HELP_STRIPE_LINK;
}

function statusLabel(status) {
  const labels = {
    wachten_op_verhalen: 'Wachten op verhalen',
    verhalen_klaar_vervolgvragen_genereren: 'Vervolgvragen worden voorbereid',
    wachten_op_vervolgvragen: 'Wachten op vervolgvragen',
    document_genereren: 'Document wordt opgesteld',
    klaar: 'Klaar',
    veiligheid_gestopt: 'Gestopt om veiligheidsredenen',
    document_mislukt: 'Er ging iets mis, neem contact op',
  };
  if ((status || '').startsWith('nieuwe_ronde_')) return 'Opvolging bezig';
  return labels[status] || status;
}

function planLabel(plan) {
  const labels = { gratis: 'Gratis', los: 'Eén gesprek', starter: 'Starter', plus: 'Plus', pro: 'Pro' };
  return labels[plan] || plan;
}

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = '/login.html';
}

async function loadSessionLinks(sessionToken, containerId) {
  const box = document.getElementById(containerId);
  box.innerHTML = '<p style="color:var(--ink-soft);font-size:.85rem">Even laden...</p>';
  try {
    const res = await fetch(`/.netlify/functions/get-session-links?token=${sessionToken}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    box.innerHTML = data.links.map(l => `
      <div style="margin-bottom:10px">
        <div style="font-size:.82rem;color:var(--ink-soft);margin-bottom:4px">${esc(l.name)}${l.isOrganizer ? ' (jij)' : ''} · ${esc(l.email) || 'geen e-mailadres'}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
          <input type="text" readonly value="${window.location.origin}${l.accessLink}" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:.75rem">
          <button onclick="navigator.clipboard.writeText('${window.location.origin}${l.accessLink}')" class="icon-btn" title="Kopieer">📋</button>
        </div>
        ${!l.isOrganizer ? `
        <div style="font-size:.72rem;color:var(--ink-soft);margin-bottom:4px">E-mailadres van ${esc(l.name)} wijzigen</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="email" id="emailEdit_${l.id}" placeholder="Nieuw e-mailadres" value="${esc(l.email) || ''}" style="flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:.78rem">
          <button type="button" class="btn outline" style="padding:6px 10px;font-size:.75rem" onclick="updateParticipantEmail('${sessionToken}', '${l.id}', 'emailEdit_${l.id}', this)">Wijzig e-mail</button>
        </div>
        <div id="emailEditMsg_${l.id}" style="font-size:.75rem;margin-top:4px"></div>` : ''}
      </div>`).join('');
  } catch (err) {
    box.innerHTML = `<p style="color:#8A4222;font-size:.85rem">${esc(err.message)}</p>`;
  }
}

async function updateParticipantEmail(sessionToken, participantId, inputId, btn) {
  const input = document.getElementById(inputId);
  const msg = document.getElementById(`emailEditMsg_${participantId}`);
  const newEmail = input.value.trim();
  msg.textContent = '';
  msg.style.color = '';
  if (!newEmail || !newEmail.includes('@')) {
    msg.style.color = '#8A4222';
    msg.textContent = 'Vul een geldig e-mailadres in.';
    return;
  }
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = 'Bezig...';
  try {
    const res = await fetch('/.netlify/functions/update-participant-email', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ organizerToken: sessionToken, participantId, newEmail }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    msg.style.color = 'var(--sage)';
    msg.textContent = 'Gelukt. Deze persoon kreeg een mail met zijn link naar dit nieuwe adres.';
  } catch (err) {
    msg.style.color = '#8A4222';
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
}

async function startFollowup(accessLinkAbsolute, btn) {
  const t = new URLSearchParams(accessLinkAbsolute.split('?')[1]).get('token');
  btn.disabled = true;
  btn.textContent = 'Even geduld...';
  try {
    const res = await fetch('/.netlify/functions/start-new-round', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: t }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    window.location.href = accessLinkAbsolute;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Vul opvolgdocument in';
    alert(err.message);
  }
}

async function deleteSession(sessionId, btn) {
  if (!confirm('Weet je zeker dat je dit gesprek definitief wil verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
  btn.disabled = true;
  btn.textContent = 'Bezig...';
  try {
    const res = await fetch('/.netlify/functions/delete-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentAccessToken}` },
      body: JSON.stringify({ sessionId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    load();
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = 'Verwijder gesprek';
  }
}

async function load() {
  if (!supabaseClient) {
    app.innerHTML = `<div class="error-box">Er ging iets mis met de configuratie van deze pagina. Neem contact op als dit blijft duren.</div>`;
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = '/login.html';
    return;
  }
  currentAccessToken = session.access_token;

  try {
    const res = await fetch('/.netlify/functions/get-my-sessions', {
      headers: { 'Authorization': `Bearer ${currentAccessToken}` },
    });
    const data = await res.json();

    if (!res.ok) {
      app.innerHTML = `
        <span class="label">Fout</span>
        <h1>Er ging iets mis</h1>
        <p style="color:var(--ink-soft)">${esc(data.error)}</p>
        <a href="/login.html" class="btn clay">Opnieuw inloggen</a>`;
      return;
    }

    const isPaidPlan = data.plan && data.plan !== 'gratis';
    const hasSessions = data.sessions && data.sessions.length > 0;
    const hasReflections = data.reflections && data.reflections.length > 0;

    if (!hasSessions && !hasReflections) {
      app.innerHTML = `
        <span class="label">Mijn gesprekken</span>
        <h1>Nog niets gevonden</h1>
        <p style="color:var(--ink-soft)">We vonden geen gesprekken of reflecties gekoppeld aan ${esc(data.email)}.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a href="/reflectie.html" class="btn clay">Start een gratis reflectie</a>
          <button type="button" class="btn outline" onclick="logout()">Log uit</button>
        </div>`;
      return;
    }

    const countLine = `${hasSessions ? data.sessions.length : 0} gesprek${(data.sessions && data.sessions.length === 1) ? '' : 'ken'}, ${hasReflections ? data.reflections.length : 0} reflectie${(data.reflections && data.reflections.length === 1) ? '' : 's'}`;

    app.innerHTML = `
      <span class="label">Mijn gesprekken</span>
      <h1>Welkom terug</h1>
      <p style="color:var(--ink-soft);margin-bottom:8px">Ingelogd als <strong id="currentEmailDisplay">${esc(data.email)}</strong> · <button type="button" id="logoutBtn" class="btn outline" style="padding:4px 10px;font-size:.75rem;vertical-align:middle">Log uit</button></p>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:.78rem;background:var(--clay-soft);color:var(--clay);padding:4px 10px;border-radius:999px">${planLabel(data.plan)}</span>
        ${isPaidPlan ? `<a href="${STRIPE_PORTAL}" target="_blank" class="btn outline" style="padding:7px 14px;font-size:.82rem">Abonnement beheren of opzeggen</a>` : ''}
      </div>
      <p style="font-size:.82rem;color:var(--ink-soft);margin-bottom:20px">${countLine}</p>

      ${isPaidPlan ? `
      <div class="card" style="background:#EFF4ED;border:none;margin-bottom:24px;padding:16px">
        <p style="margin:0;font-size:.85rem">Al je documenten blijven hier altijd terug te vinden, ook je opvolgdocumenten en je eigen ingevulde antwoorden. Zodra jullie document klaar is, kan je hieronder op elk moment een opvolging starten, je hoeft daar niet op te wachten.</p>
      </div>` : ''}
${hasReflections ? `
      <div style="margin-bottom:40px">
        <span class="label" style="display:block;margin-bottom:16px">Mijn reflecties</span>
        <div id="reflectionsList"></div>
      </div>` : ''}

      <span class="label" style="display:block;margin-bottom:16px">Gesprekken met anderen</span>
      ${hasSessions ? `<div id="sessionsList"></div>` : `
      <div class="card" style="margin-bottom:24px">
        <p style="margin:0;color:var(--ink-soft)">Nog geen betaald gesprek gestart.</p>
      </div>`}

      <div style="margin-top:32px;display:flex;gap:10px;flex-wrap:wrap">
        <a href="/new.html" class="btn outline">Start een nieuw gesprek</a>
        <a href="/reflectie.html" class="btn outline">Nieuwe reflectie maken</a>
      </div>`;

    document.getElementById('logoutBtn').addEventListener('click', logout);

    if (hasSessions) {
      const list = document.getElementById('sessionsList');
      data.sessions.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'session-card';

        const isKlaar = s.status === 'klaar';
        const isFollowupBezig = (s.status || '').startsWith('nieuwe_ronde_');
        const statusText = statusLabel(s.status);
        const linksBoxId = `linksBox_${idx}`;
        const followupUsed = !!s.followupUsed;

        let followupButton = '';
        if (isKlaar && s.plan && s.plan !== 'gratis' && !followupUsed) {
          followupButton = `<button type="button" class="btn outline" onclick="startFollowup('${window.location.origin}${s.accessLink}', this)">Vul opvolgdocument in</button>`;
        } else if (isFollowupBezig) {
          followupButton = `<a href="${s.accessLink}" class="btn outline">Ga verder met opvolging</a>`;
        }

        card.innerHTML = `
          <div class="session-card-header">
            <div>
              <div class="who">${esc(s.category)}</div>
              <div class="session-card-meta">
                Gestart op ${new Date(s.createdAt).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' })}${s.updatedAt ? ` · laatst bijgewerkt ${new Date(s.updatedAt).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' })}` : ''}
              </div>
            </div>
            <span class="session-status-badge" style="background:${isKlaar || isFollowupBezig ? '#EFF4ED' : 'var(--clay-soft)'};color:${isKlaar || isFollowupBezig ? 'var(--sage)' : 'var(--clay)'}">
              ${statusText}
            </span>
          </div>
          <div class="session-card-actions">
            <a href="${s.accessLink}" class="btn outline">Mijn verhaal / status</a>
            <a href="${s.accessLink}&view=antwoorden" class="btn outline">Bekijk mijn antwoorden</a>
            ${s.documentLink ? `<a href="${s.documentLink}" class="btn clay">Bekijk document</a>` : ''}
            ${followupButton}
            ${s.isOrganizer ? `<button class="btn outline" onclick="toggleLinks('${s.accessLink.split('token=')[1]}', '${linksBoxId}', this)">Bekijk alle links</button>` : ''}
          </div>
          ${s.isOrganizer ? `<div id="${linksBoxId}" style="display:none;margin-top:8px"></div>` : ''}
          <div class="session-card-footer">
            <button type="button" class="btn outline" style="padding:8px 14px;font-size:.8rem;color:#8A4222;border-color:#8A4222" onclick="deleteSession('${s.sessionId}', this)">Verwijder gesprek</button>
          </div>`;

        list.appendChild(card);
      });
    }

    if (hasReflections) {
      const rList = document.getElementById('reflectionsList');
      const recLabel = { zelf: 'Vooral iets voor jezelf', gesprek: 'Gesprek aangeraden', twijfel: 'Kan beide kanten op' };
      const recColor = { zelf: 'var(--sage)', gesprek: 'var(--clay)', twijfel: 'var(--navy)' };
      data.reflections.forEach(r => {
        const rCard = document.createElement('div');
        rCard.className = 'session-card';
        const isKlaar = r.status === 'klaar';
        rCard.innerHTML = `
          <div class="session-card-header">
            <div>
              <div class="who">${esc(r.category) || 'Reflectie'}</div>
              <div class="session-card-meta">${new Date(r.createdAt).toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
            </div>
            ${isKlaar && r.recommendation ? `<span class="session-status-badge" style="background:#EFF4ED;color:${recColor[r.recommendation] || 'var(--ink-soft)'}">${recLabel[r.recommendation] || r.recommendation}</span>` : ''}
          </div>
      ${r.situationSummary ? `<p style="color:var(--ink-soft);font-size:.88rem;margin-bottom:12px">${esc(r.situationSummary)}</p>` : ''}
          <div class="session-card-actions">
            <a href="/reflectie.html?token=${r.token}" class="btn outline">Bekijk reflectie</a>
            ${r.selfHelpStatus !== 'klaar' ? `<button type="button" class="btn clay" onclick="goToSelfHelpPayment('${r.token}', '${esc(data.email)}')">Ontvang mijn actieplan – €2,99</button>` : ''}
            <a href="/new.html?fromReflection=${r.token}" class="btn outline">Maak er een gesprek van</a>
          </div>`;
        rList.appendChild(rCard);
      });
    }

  } catch (err) {
    app.innerHTML = `<div class="error-box">Er ging iets mis: ${esc(err.message)}</div>`;
  }
}

function toggleLinks(sessionToken, containerId, btn) {
  const box = document.getElementById(containerId);
  if (box.style.display === 'none') {
    box.style.display = 'block';
    btn.textContent = 'Verberg links';
    loadSessionLinks(sessionToken, containerId);
  } else {
    box.style.display = 'none';
    btn.textContent = 'Bekijk alle links';
  }
}

load();
</script>
</body>
</html>
