<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen | Middlepoint</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="nav-bar">
<nav class="nav" aria-label="Hoofdnavigatie">
  <a href="/" class="brand">middle<span>point</span></a>
  <div class="nav-links" id="navLinks">
    <a href="/">Home</a>
    <a href="/why.html">Waarom Middlepoint</a>
    <a href="/pricing.html">Prijzen</a>
    <a href="/testimonials.html">Getuigenissen</a>
  </div>
  <div class="nav-actions">
<a href="/new.html" class="btn">Start een gesprek</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu openen" aria-expanded="false">☰</button>
  </div>
</nav>
</header>
<script>
  (function() {
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      const isOpen = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.textContent = isOpen ? '✕' : '☰';
    });
    links.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = '☰';
      });
    });
  })();
</script>

<div class="app-wrap" style="max-width:480px">
  <a href="/" class="btn ghost" style="margin-bottom:16px;display:inline-block">← Terug naar startpagina</a>
  <span class="label">Mijn gesprekken</span>
  <h1 id="pageTitle">Inloggen</h1>

  <div style="display:flex;margin-bottom:28px;border-bottom:1px solid var(--line)">
    <button type="button" id="loginTabBtn" style="padding:10px 4px;margin-right:24px;background:none;border:none;border-bottom:2px solid var(--clay);color:var(--clay);font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em">Inloggen</button>
    <button type="button" id="registerTabBtn" style="padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-soft);font-weight:600;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em">Registreren</button>
  </div>

  <div id="error" class="error-box" style="display:none"></div>
  <div id="success" style="display:none" class="status-box"></div>

  <form id="loginForm">
    <div class="field">
      <label for="loginEmail">E-mailadres</label>
      <input type="email" id="loginEmail" required placeholder="jij@email.be" autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPassword">Wachtwoord</label>
<input type="password" id="loginPassword" required placeholder="Je wachtwoord" autocomplete="current-password" style="width:100%;box-sizing:border-box">
    </div>
    <button type="submit" class="btn clay" style="width:100%;padding:14px" id="loginSubmitBtn">Inloggen</button>
  </form>

  <form id="registerForm" style="display:none">
    <div class="field">
      <label for="regEmail">E-mailadres</label>
      <input type="email" id="regEmail" required placeholder="jij@email.be" autocomplete="email">
    </div>
    <div class="field">
      <label for="regEmailConfirm">Herhaal e-mailadres</label>
      <input type="email" id="regEmailConfirm" required placeholder="jij@email.be" autocomplete="email">
    </div>
    <div class="field">
      <label for="regPassword">Wachtwoord</label>
<input type="password" id="regPassword" required placeholder="Minstens 6 tekens" autocomplete="new-password" minlength="6" style="width:100%;box-sizing:border-box">
    </div>
    <div class="field">
      <label for="regPasswordConfirm">Herhaal wachtwoord</label>
<input type="password" id="regPasswordConfirm" required placeholder="Herhaal je wachtwoord" autocomplete="new-password" minlength="6" style="width:100%;box-sizing:border-box">
    </div>
    <button type="submit" class="btn clay" style="width:100%;padding:14px" id="registerSubmitBtn">Account aanmaken</button>
  </form>

  <p style="margin-top:24px;font-size:.85rem;color:var(--ink-soft)">Heb je nog geen gesprek gestart? <a href="/new.html">Begin hier</a>.</p>
</div>

<script>
// TODO: vul deze twee waarden in — Supabase-dashboard → Settings → API
const SUPABASE_URL = 'JOUW_SUPABASE_URL_HIER';
const SUPABASE_ANON_KEY = 'JOUW_SUPABASE_ANON_KEY_HIER';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginTabBtn = document.getElementById('loginTabBtn');
const registerTabBtn = document.getElementById('registerTabBtn');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const errorBox = document.getElementById('error');
const successBox = document.getElementById('success');
const pageTitle = document.getElementById('pageTitle');

function showLoginTab() {
  loginTabBtn.style.borderBottomColor = 'var(--clay)';
  loginTabBtn.style.color = 'var(--clay)';
  registerTabBtn.style.borderBottomColor = 'transparent';
  registerTabBtn.style.color = 'var(--ink-soft)';
  loginForm.style.display = 'block';
  registerForm.style.display = 'none';
  successBox.style.display = 'none';
  pageTitle.textContent = 'Inloggen';
  errorBox.style.display = 'none';
}
function showRegisterTab() {
  registerTabBtn.style.borderBottomColor = 'var(--clay)';
  registerTabBtn.style.color = 'var(--clay)';
  loginTabBtn.style.borderBottomColor = 'transparent';
  loginTabBtn.style.color = 'var(--ink-soft)';
  loginForm.style.display = 'none';
  registerForm.style.display = 'block';
  successBox.style.display = 'none';
  pageTitle.textContent = 'Account aanmaken';
  errorBox.style.display = 'none';
}
loginTabBtn.addEventListener('click', showLoginTab);
registerTabBtn.addEventListener('click', showRegisterTab);

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = '/mijn-gesprekken.html';
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Even geduld...';
  try {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = '/mijn-gesprekken.html';
  } catch (err) {
    errorBox.textContent = err.message === 'Invalid login credentials'
      ? 'E-mailadres of wachtwoord klopt niet.'
      : err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Inloggen';
  }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = 'none';
  successBox.style.display = 'none';
  const email = document.getElementById('regEmail').value.trim();
  const emailConfirm = document.getElementById('regEmailConfirm').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;
  const btn = document.getElementById('registerSubmitBtn');

  if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
    errorBox.textContent = 'De twee e-mailadressen komen niet overeen.';
    errorBox.style.display = 'block';
    return;
  }
  if (password !== passwordConfirm) {
    errorBox.textContent = 'De twee wachtwoorden komen niet overeen.';
    errorBox.style.display = 'block';
    return;
  }
  if (password.length < 6) {
    errorBox.textContent = 'Je wachtwoord moet minstens 6 tekens lang zijn.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Even geduld...';
  try {
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) throw error;
    if (data.session) {
      window.location.href = '/mijn-gesprekken.html';
      return;
    }
    registerForm.style.display = 'none';
    successBox.style.display = 'block';
    successBox.innerHTML = '<p style="margin:0;color:var(--sage)">Bijna klaar! We stuurden een bevestigingsmail naar je e-mailadres. Klik op de link daarin, en kom dan terug om in te loggen.</p>';
  } catch (err) {
    errorBox.textContent = err.message.includes('already registered')
      ? 'Er bestaat al een account met dit e-mailadres. Probeer in te loggen.'
      : err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Account aanmaken';
  }
});
</script>
</body>
</html>
