<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>Mijn gesprekken terugvinden, Middlepoint</title>
<link rel="stylesheet" href="/style.css">

<body>
<header class="nav-bar">
<nav class="nav" aria-label="Hoofdnavigatie">

  <div class="nav-links" id="navLinks">

<a href="/new.html" class="btn">Start een gesprek</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu openen" aria-expanded="false">☰</button>
  </div>
</nav>
</header>
<script>
  (function() {
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      const isOpen = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.textContent = isOpen ? '✕' : '☰';
    });
    links.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        links.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = '☰';
      });
    });
  })();
</script>
<script>
(async () => {
  try {
    const SUPABASE_URL = 'https://uhpafymwenrmqgyunpuy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVocGFmeW13ZW5ybXFneXVucHV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzMyMjcsImV4cCI6MjA5NzkwOTIyN30.fYPvz1deMeIG4W-JY6BPTmzOZt6FXUgqpH1FIjcHGEw';
    const persistent = localStorage.getItem('mp_remember_me') === 'true';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: persistent ? window.localStorage : window.sessionStorage },
    });
    const { data: { session } } = await client.auth.getSession();
    if (session && session.user) {
      const storedName = session.user.user_metadata && session.user.user_metadata.name;
      const displayName = (storedName && storedName.trim()) || session.user.email.split('@')[0];
      const badge = document.getElementById('authStatus');
      if (badge) {
        badge.style.display = 'flex';
        document.getElementById('authInitial').textContent = displayName.charAt(0).toUpperCase();
      }
    }
  } catch (e) { /* stil falen, rondje blijft gewoon verborgen */ }
})();
</script>
